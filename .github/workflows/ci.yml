name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 = Raspberry Pi OS Bookworm, 3.13 = Trixie
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        env:
          SIGNAGE_LOG_LEVEL: WARNING

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build

  install-script:
    # Runs the real installer on a fresh Ubuntu machine (systemd + sudo),
    # then checks the service answers and survives an update.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ShellCheck
        run: shellcheck install.sh
      - name: Install from this checkout
        run: |
          git branch -f ci-install HEAD
          sudo SIGNAGE_REPO="$PWD" bash install.sh --yes --no-nginx --branch ci-install --user signage
      - name: Check the running service
        run: |
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/admin/config)" = 401
          sudo test -f /opt/digital-signage/data/secret_key
          sudo stat -c '%a %U' /opt/digital-signage/data/auth.json | grep -q '^600 signage$'
      - name: Update keeps settings
        run: |
          curl -fsS -c ck -b ck -H 'X-Requested-With: signage' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin"}' http://127.0.0.1:8080/api/auth/login
          curl -fsS -c ck -b ck -X PUT -H 'X-Requested-With: signage' -H 'Content-Type: application/json' \
            -d '{"config":{"location":{"name":"CI Town"}}}' http://127.0.0.1:8080/api/admin/config
          sudo SIGNAGE_REPO="$PWD" bash /opt/digital-signage/install.sh --update --yes --no-nginx --branch ci-install
          curl -fsS http://127.0.0.1:8080/api/display | grep -q 'CI Town'
      - name: Update from the admin page
        run: |
          curl -fsS -c ck -b ck -H 'X-Requested-With: signage' -H 'Content-Type: application/json'             -d '{"username":"admin","password":"admin"}' http://127.0.0.1:8080/api/auth/login
          curl -fsS -b ck -X POST -H 'X-Requested-With: signage' http://127.0.0.1:8080/api/admin/update/start
          for _ in $(seq 1 120); do
            sudo grep -q '^@@RESULT' /var/log/digital-signage/update.log 2>/dev/null && break
            sleep 5
          done
          sudo tail -25 /var/log/digital-signage/update.log
          sudo grep -q '^@@RESULT 0 ' /var/log/digital-signage/update.log
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/api/display | grep -q 'CI Town'
      - name: Service logs
        if: always()
        run: sudo journalctl -u digital-signage -n 100 --no-pager || true
